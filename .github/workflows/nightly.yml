name: Nightly Builds

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: macos-arm
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows-x64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: linux-x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        run: npm install --prefix frontend

      - name: Build Tauri app
        run: npm run build -- --target ${{ matrix.target }}

      - name: Package bundle
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            powershell -Command "Compress-Archive -Path target/${{ matrix.target }}/release/bundle -DestinationPath tau-${{ matrix.artifact }}.zip"
          else
            zip -r tau-${{ matrix.artifact }}.zip target/${{ matrix.target }}/release/bundle
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tau-${{ matrix.artifact }}
          path: tau-${{ matrix.artifact }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create nightly release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: nightly
          name: Nightly Build
          body: Latest nightly builds for macOS, Windows, and Linux.
          artifacts: "artifacts/*.zip"
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: false
